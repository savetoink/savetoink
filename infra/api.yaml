AWSTemplateFormatVersion: "2010-09-09"
Description: Save to Ink - API Backend resources

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project (used for resource naming)

  SourceBucketName:
    Type: String
    Description: Name of the S3 bucket containing the Lambda source code

  SourceBucketKey:
    Type: String
    Description: S3 key for Lambda source zip file

  ProcessorSourceBucketKey:
    Type: String
    Description: S3 key for Processor Lambda source zip file

  SchedulerSourceBucketKey:
    Type: String
    Description: S3 key for Scheduler Lambda source zip file

  BackupBucketName:
    Type: String
    Description: Name of the S3 bucket for storing backups

  MailBackend:
    Type: String
    Description: The name of the email backend (e.g. mailjet)
    Default: ""

  MailjetAPIKey:
    Type: String
    NoEcho: true
    Description: Mailjet API key
    Default: ""

  MailjetAPISecret:
    Type: String
    NoEcho: true
    Description: Mailjet API secret
    Default: ""

  MailjetWebhookSecret:
    Type: String
    NoEcho: true
    Description: Mailjet Webhook secret
    Default: ""

  APIKeySecret:
    Type: String
    NoEcho: true
    Description: Secret API key for authentication

  CORSAllowOrigin:
    Type: String
    Description: CORS allow origin for API requests
    Default: ""

  SenderEmail:
    Type: String
    Description: Verified sender email address

  Auth0Domain:
    Type: String
    Description: Auth0 domain
    Default: ""

  Auth0Audience:
    Type: String
    Description: Auth0 audience
    Default: ""

  Auth0ClientId:
    Type: String
    Description: Auth0 client ID
    Default: ""

  Auth0ClientSecret:
    Type: String
    NoEcho: true
    Description: Auth0 client secret
    Default: ""

  AuthBackend:
    Type: String
    Description: Auth backend
    Default: ""

  StorageBackend:
    Type: String
    Description: Storage backend (dynamodb or sqlite)
    Default: "dynamodb"

  Debug:
    Type: String
    Description: Debug flag
    Default: "false"

  DisableQuotaCheck:
    Type: String
    Description: Disable quota check for sends (useful until subscriptions are ready)
    Default: "false"

  LoggingProvider:
    Type: String
    Description: Logging backend (sentry or empty to disable)
    Default: ""

  SentryDSN:
    Type: String
    NoEcho: true
    Description: Sentry DSN for error tracking
    Default: ""

  SentryEnvironment:
    Type: String
    Description: Sentry environment name (e.g., production, staging)
    Default: ""

  SentrySampleRate:
    Type: String
    Description: Sentry sample rate (0.0 to 1.0)
    Default: "1.0"

  BrowserlessKey:
    Type: String
    NoEcho: true
    Description: Browserless API key for fallback content fetching
    Default: ""

  DomainName:
    Type: String
    Description: Custom domain name for the API (e.g. api.saveto.ink)
    Default: ""

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the custom domain (must be in us-east-1)
    Default: ""

  GitHubRepository:
    Type: String
    Description: "GitHub repository for OIDC authentication (format: owner/repo)"
    Default: "savetoink/savetoink"

  GitHubEnvironmentName:
    Type: String
    Description: "GitHub environment name for OIDC authentication"
    Default: ""

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-lambda-invoke-processor"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:*:*:function:${ProjectName}-processor"
        - PolicyName: !Sub "${ProjectName}-dynamodb-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ArticleTable.Arn
                  - !Sub "${ArticleTable.Arn}/index/*"
                  - !GetAtt ArticleTagsTable.Arn
                  - !Sub "${ArticleTagsTable.Arn}/index/*"
                  - !GetAtt SendsTable.Arn
                  - !Sub "${SendsTable.Arn}/index/*"
                  - !GetAtt UserProfileTable.Arn
                  - !Sub "${UserProfileTable.Arn}/index/*"

  ProcessorLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-processor-lambda-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-processor-dynamodb-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ArticleTable.Arn
                  - !Sub "${ArticleTable.Arn}/index/*"
                  - !GetAtt UserProfileTable.Arn
                  - !Sub "${UserProfileTable.Arn}/index/*"

  SchedulerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-scheduler-lambda-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-scheduler-dynamodb-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ArticleTable.Arn
                  - !GetAtt ArticleTagsTable.Arn
                  - !GetAtt UserProfileTable.Arn
                  - !GetAtt SendsTable.Arn
        - PolicyName: !Sub "${ProjectName}-scheduler-s3-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BackupS3Bucket.Arn
                  - !Sub "${BackupS3Bucket.Arn}/*"

  #############################
  # Lambda function for the API
  #############################
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Description: !Sub "${ProjectName} API - Article conversion and delivery service"
      Runtime: provided.al2023
      Handler: bootstrap
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref SourceBucketName
        S3Key: !Ref SourceBucketKey
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SAVETOINK_API_KEY: !Ref APIKeySecret
          SAVETOINK_ARTICLE_TABLE_NAME: !Ref ArticleTable
          SAVETOINK_ARTICLE_TAGS_TABLE_NAME: !Ref ArticleTagsTable
          SAVETOINK_AUTH0_AUDIENCE: !Ref Auth0Audience
          SAVETOINK_AUTH0_CLIENT_ID: !Ref Auth0ClientId
          SAVETOINK_AUTH0_CLIENT_SECRET: !Ref Auth0ClientSecret
          SAVETOINK_AUTH0_DOMAIN: !Ref Auth0Domain
          SAVETOINK_AUTH_BACKEND: !Ref AuthBackend
          SAVETOINK_BROWSERLESS_KEY: !Ref BrowserlessKey
          SAVETOINK_CORS_ALLOW_ORIGIN: !Ref CORSAllowOrigin
          SAVETOINK_DEBUG: !Ref Debug
          SAVETOINK_DISABLE_QUOTA_CHECK: !Ref DisableQuotaCheck
          SAVETOINK_EMAIL_BACKEND: !Ref MailBackend
          SAVETOINK_LOGGING_PROVIDER: !Ref LoggingProvider
          SAVETOINK_MAILJET_API_KEY: !Ref MailjetAPIKey
          SAVETOINK_MAILJET_API_SECRET: !Ref MailjetAPISecret
          SAVETOINK_MAILJET_WEBHOOK_SECRET: !Ref MailjetWebhookSecret
          SAVETOINK_PROCESS_ARTICLE_LAMBDA: !Sub "${ProjectName}-processor"
          SAVETOINK_SENDER_EMAIL: !Ref SenderEmail
          SAVETOINK_SENDS_TABLE_NAME: !Ref SendsTable
          SAVETOINK_SENTRY_DSN: !Ref SentryDSN
          SAVETOINK_SENTRY_ENVIRONMENT: !Ref SentryEnvironment
          SAVETOINK_SENTRY_SAMPLE_RATE: !Ref SentrySampleRate
          SAVETOINK_STORAGE_BACKEND: !Ref StorageBackend
          SAVETOINK_USER_PROFILE_TABLE_NAME: !Ref UserProfileTable

      TracingConfig:
        Mode: PassThrough

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunction}"
      RetentionInDays: 30

  LambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt LambdaFunction.Arn

  LambdaFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  LambdaFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: "*"

  #############################
  # Lambda function for Processor
  #############################
  ProcessorLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-processor"
      Description: !Sub "${ProjectName} Processor - Async article processing service"
      Runtime: provided.al2023
      Handler: bootstrap
      Role: !GetAtt ProcessorLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref SourceBucketName
        S3Key: !Ref ProcessorSourceBucketKey
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          SAVETOINK_API_KEY: !Ref APIKeySecret
          SAVETOINK_ARTICLE_TABLE_NAME: !Ref ArticleTable
          SAVETOINK_BROWSERLESS_KEY: !Ref BrowserlessKey
          SAVETOINK_DEBUG: !Ref Debug
          SAVETOINK_DISABLE_QUOTA_CHECK: !Ref DisableQuotaCheck
          SAVETOINK_EMAIL_BACKEND: !Ref MailBackend
          SAVETOINK_LOGGING_PROVIDER: !Ref LoggingProvider
          SAVETOINK_MAILJET_API_KEY: !Ref MailjetAPIKey
          SAVETOINK_MAILJET_API_SECRET: !Ref MailjetAPISecret
          SAVETOINK_MAILJET_WEBHOOK_SECRET: !Ref MailjetWebhookSecret
          SAVETOINK_SENDER_EMAIL: !Ref SenderEmail
          SAVETOINK_SENDS_TABLE_NAME: !Ref SendsTable
          SAVETOINK_SENTRY_DSN: !Ref SentryDSN
          SAVETOINK_SENTRY_ENVIRONMENT: !Ref SentryEnvironment
          SAVETOINK_SENTRY_SAMPLE_RATE: !Ref SentrySampleRate
          SAVETOINK_STORAGE_BACKEND: !Ref StorageBackend
          SAVETOINK_USER_PROFILE_TABLE_NAME: !Ref UserProfileTable
      TracingConfig:
        Mode: PassThrough

  ProcessorLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessorLambdaFunction}"
      RetentionInDays: 30

  ProcessorLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessorLambdaFunction
      Action: lambda:InvokeFunction
      Principal: !GetAtt LambdaExecutionRole.Arn

  #############################
  # Lambda function for Scheduler
  #############################
  SchedulerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-scheduler"
      Description: !Sub "${ProjectName} Scheduler - Scheduled administrative tasks"
      Runtime: provided.al2023
      Handler: bootstrap
      Role: !GetAtt SchedulerLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref SourceBucketName
        S3Key: !Ref SchedulerSourceBucketKey
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          SAVETOINK_API_KEY: !Ref APIKeySecret
          SAVETOINK_ARTICLE_TABLE_NAME: !Ref ArticleTable
          SAVETOINK_ARTICLE_TAGS_TABLE_NAME: !Ref ArticleTagsTable
          SAVETOINK_BACKUP_BUCKET_NAME: !Ref BackupS3Bucket
          SAVETOINK_DEBUG: !Ref Debug
          SAVETOINK_DISABLE_QUOTA_CHECK: !Ref DisableQuotaCheck
          SAVETOINK_LOGGING_PROVIDER: !Ref LoggingProvider
          SAVETOINK_SENDS_TABLE_NAME: !Ref SendsTable
          SAVETOINK_SENTRY_DSN: !Ref SentryDSN
          SAVETOINK_SENTRY_ENVIRONMENT: !Ref SentryEnvironment
          SAVETOINK_SENTRY_SAMPLE_RATE: !Ref SentrySampleRate
          SAVETOINK_STORAGE_BACKEND: !Ref StorageBackend
          SAVETOINK_USER_PROFILE_TABLE_NAME: !Ref UserProfileTable
      TracingConfig:
        Mode: PassThrough

  SchedulerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SchedulerLambdaFunction}"
      RetentionInDays: 30

  SchedulerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerLambdaFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com

  ############################
  # IAM Role for EventBridge Scheduler to invoke Lambda
  ############################
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-scheduler-invoke"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-scheduler-invoke-lambda"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt SchedulerLambdaFunction.Arn

  #############################
  # Scheduler Schedule Group
  #############################
  SchedulerScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${ProjectName}-scheduler-group"

  #############################
  # EventBridge Scheduler Schedule for Daily Tasks
  #############################
  SchedulerScheduleRule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-scheduler-schedule"
      Description: Daily execution of scheduled administrative tasks
      GroupName: !Ref SchedulerScheduleGroup
      ScheduleExpression: cron(0 0 * * ? *)
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt SchedulerLambdaFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{ "task": "backup", "schedule": "0 0 0 * * *" }'

  #############################
  # CloudFront Distribution
  #############################
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCustomDomain
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: /
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: LambdaOrigin
            DomainName:
              !Select [
                0,
                !Split [
                  "/",
                  !Select [
                    1,
                    !Split ["://", !GetAtt LambdaFunctionUrl.FunctionUrl],
                  ],
                ],
              ]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: LambdaOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - HEAD
            - DELETE
            - POST
            - GET
            - OPTIONS
            - PUT
            - PATCH
          Compress: true
          ForwardedValues:
            Headers:
              - Authorization
              - User-Agent
              - Origin
            QueryString: true
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: LambdaOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - HEAD
              - DELETE
              - POST
              - GET
              - OPTIONS
              - PUT
              - PATCH
            Compress: true
            ForwardedValues:
              Headers:
                - Authorization
                - User-Agent
                - Origin
              QueryString: true
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Aliases:
          - !Ref DomainName

  ##########
  # DynamoDB
  ##########
  ArticleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-articles"
      AttributeDefinitions:
        - AttributeName: account
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: accountFavorite
          AttributeType: S
      KeySchema:
        - AttributeName: account
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AccountCreatedAtIndex
          KeySchema:
            - AttributeName: account
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - author
              - deliveryStatus
              - error
              - excerpt
              - favorite
              - id
              - imageUrl
              - language
              - publishedAt
              - readingTimeMinutes
              - siteName
              - sourceDomain
              - tags
              - title
              - url
              - wordCount
        - IndexName: AccountFavoriteIndex
          KeySchema:
            - AttributeName: accountFavorite
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - account
              - author
              - deliveryStatus
              - error
              - excerpt
              - favorite
              - id
              - imageUrl
              - language
              - publishedAt
              - readingTimeMinutes
              - siteName
              - sourceDomain
              - tags
              - title
              - url
              - wordCount
      BillingMode: PAY_PER_REQUEST

  ArticleTagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-article-tags"
      AttributeDefinitions:
        - AttributeName: accountTag
          AttributeType: S
        - AttributeName: createdAtArticleId
          AttributeType: S
      KeySchema:
        - AttributeName: accountTag
          KeyType: HASH
        - AttributeName: createdAtArticleId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  UserProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-user-profiles"
      AttributeDefinitions:
        - AttributeName: account
          AttributeType: S
      KeySchema:
        - AttributeName: account
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  SendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-sends"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: account
          AttributeType: S
        - AttributeName: articleId
          AttributeType: S
        - AttributeName: sentAt
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ArticleIdIndex
          KeySchema:
            - AttributeName: articleId
              KeyType: HASH
            - AttributeName: sentAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AccountSentAtIndex
          KeySchema:
            - AttributeName: account
              KeyType: HASH
            - AttributeName: sentAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  #############################
  # Backup S3 Bucket
  #############################
  BackupS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BackupBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldBackups
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  #############################
  # GitHub OIDC Provider
  #############################
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-actions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironmentName}"

  GitHubActionsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-github-actions-deploy"
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:aws:s3:::${SourceBucketName}/${SourceBucketKey}"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:aws:s3:::${SourceBucketName}/${ProcessorSourceBucketKey}"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:aws:s3:::${SourceBucketName}/${SchedulerSourceBucketKey}"
          - Effect: Allow
            Action:
              - lambda:UpdateFunctionCode
            Resource:
              - !Sub "arn:aws:lambda:*:*:function:${ProjectName}-api"
              - !Sub "arn:aws:lambda:*:*:function:${ProjectName}-processor"
              - !Sub "arn:aws:lambda:*:*:function:${ProjectName}-scheduler"

Outputs:
  FunctionName:
    Description: Name of the Lambda function
    Value: !Ref LambdaFunction

  FunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt LambdaFunction.Arn

  FunctionUrl:
    Description: Function URL endpoint
    Value: !GetAtt LambdaFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${ProjectName}-function-url"

  DynamoDBTableName:
    Description: Name of the DynamoDB table for storing articles
    Value: !Ref ArticleTable
    Export:
      Name: !Sub "${ProjectName}-dynamodb-table-name"

  DynamoDBTableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt ArticleTable.Arn
    Export:
      Name: !Sub "${ProjectName}-dynamodb-table-arn"

  UserProfileTableName:
    Description: Name of the DynamoDB table for storing user profiles
    Value: !Ref UserProfileTable
    Export:
      Name: !Sub "${ProjectName}-user-profile-table-name"

  UserProfileTableArn:
    Description: ARN of the user profile DynamoDB table
    Value: !GetAtt UserProfileTable.Arn
    Export:
      Name: !Sub "${ProjectName}-user-profile-table-arn"

  ArticleTagsTableName:
    Description: Name of the DynamoDB table for storing article tags
    Value: !Ref ArticleTagsTable
    Export:
      Name: !Sub "${ProjectName}-article-tags-table-name"

  ArticleTagsTableArn:
    Description: ARN of the article tags DynamoDB table
    Value: !GetAtt ArticleTagsTable.Arn
    Export:
      Name: !Sub "${ProjectName}-article-tags-table-arn"

  SendsTableName:
    Description: Name of the DynamoDB table for storing sends
    Value: !Ref SendsTable
    Export:
      Name: !Sub "${ProjectName}-sends-table-name"

  SendsTableArn:
    Description: ARN of the sends DynamoDB table
    Value: !GetAtt SendsTable.Arn
    Export:
      Name: !Sub "${ProjectName}-sends-table-arn"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution
    Condition: UseCustomDomain

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Condition: UseCustomDomain

  CustomDomainUrl:
    Description: Custom domain URL for the API
    Value: !Sub "https://${DomainName}"
    Condition: UseCustomDomain

  LogGroupName:
    Description: CloudWatch log group name for Lambda
    Value: !Ref LambdaLogGroup

  GitHubActionsRoleArn:
    Description: ARN of the GitHub Actions IAM role for OIDC authentication
    Value: !GetAtt GitHubActionsRole.Arn

  GitHubOIDCProviderArn:
    Description: ARN of the GitHub OIDC provider
    Value: !GetAtt GitHubOIDCProvider.Arn

  ProcessorFunctionName:
    Description: Name of Processor Lambda function
    Value: !Ref ProcessorLambdaFunction
    Export:
      Name: !Sub "${ProjectName}-processor-function-name"

  ProcessorFunctionArn:
    Description: ARN of Processor Lambda function
    Value: !GetAtt ProcessorLambdaFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-processor-function-arn"

  BackupS3BucketName:
    Description: Name of the backup S3 bucket
    Value: !Ref BackupS3Bucket
    Export:
      Name: !Sub "${ProjectName}-backup-bucket-name"

  BackupS3BucketArn:
    Description: ARN of the backup S3 bucket
    Value: !GetAtt BackupS3Bucket.Arn
    Export:
      Name: !Sub "${ProjectName}-backup-bucket-arn"

  SchedulerFunctionName:
    Description: Name of Scheduler Lambda function
    Value: !Ref SchedulerLambdaFunction
    Export:
      Name: !Sub "${ProjectName}-scheduler-function-name"

  SchedulerFunctionArn:
    Description: ARN of Scheduler Lambda function
    Value: !GetAtt SchedulerLambdaFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-scheduler-function-arn"

  SchedulerScheduleGroupArn:
    Description: ARN of the scheduler schedule group
    Value: !GetAtt SchedulerScheduleGroup.Arn
    Export:
      Name: !Sub "${ProjectName}-scheduler-schedule-group-arn"
