<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>
  </head>
  <body>
    <div id="status">Processing authentication...</div>
    <script type="module">
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorDescription = urlParams.get('error_description');

      const statusEl = document.getElementById('status');

      if (error) {
        statusEl.textContent = `Authentication failed: ${errorDescription || error}`;
        setTimeout(() => window.close(), 3000);
      } else if (code) {
        chrome.runtime.sendMessage(
          { type: 'AUTH_CALLBACK', code, state },
          (response) => {
            if (chrome.runtime.lastError) {
              statusEl.textContent = `Error: ${chrome.runtime.lastError.message}`;
            } else if (response?.success) {
              statusEl.textContent = 'Authentication successful! You can close this window.';
              setTimeout(() => window.close(), 1500);
            } else {
              statusEl.textContent = `Authentication failed: ${response?.error || 'Unknown error'}`;
            }
          }
        );
      } else {
        statusEl.textContent = 'No authorization code found.';
        setTimeout(() => window.close(), 3000);
      }
    </script>
  </body>
</html>
