name: Build and publish Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Grab VERSION
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push CLI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/savetoink/savetoink-cli:latest,ghcr.io/savetoink/savetoink-cli:${{ env.VERSION }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.http
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/savetoink/savetoink-api:latest,ghcr.io/savetoink/savetoink-api:${{ env.VERSION }}
