name: Deploy Lambda - Dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - backend/**
      - go.mod
      - go.sum
      - infra/**
      - VERSION

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-lambda.yml
    with:
      environment: dev
