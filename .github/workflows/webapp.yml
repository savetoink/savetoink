name: Deploy webapp on Cloudflare

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  push:
    branches:
      - master
      - dev
    paths:
      - frontend/**
      - VERSION

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: ${{ inputs.environment }}
          secrets: |
            COOKIE_SECRET
            PUBLIC_API_URL
            PUBLIC_APP_URL
            PUBLIC_AUTH0_AUDIENCE
            PUBLIC_AUTH0_CLIENT_ID
            PUBLIC_AUTH0_DOMAIN
            PUBLIC_IS_DEV_WORKER
            PUBLIC_SENTRY_ENVIRONMENT
            SENTRY_AUTH_TOKEN
        env:
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_AUTH0_AUDIENCE: ${{ vars.PUBLIC_AUTH0_AUDIENCE }}
          PUBLIC_AUTH0_CLIENT_ID: ${{ vars.PUBLIC_AUTH0_CLIENT_ID }}
          PUBLIC_AUTH0_DOMAIN: ${{ vars.PUBLIC_AUTH0_DOMAIN }}
          PUBLIC_IS_DEV_WORKER: ${{ vars.PUBLIC_IS_DEV_WORKER }}
          PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
