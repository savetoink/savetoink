name: Deploy Lambda

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: ./.github/actions/checkout

      - name: Set up Go and Just
        uses: ./.github/actions/setup-go-and-just

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy API Lambda (hide output to avoid leaking secrets)
        run: SAVETOINK_BUCKET=${{ vars.SAVETOINK_BUCKET }} just deploy-lambda-api > /dev/null

      - name: Deploy Processor Lambda (hide output to avoid leaking secrets)
        run: SAVETOINK_BUCKET=${{ vars.SAVETOINK_BUCKET }} just deploy-lambda-processor > /dev/null

      - name: Deploy Scheduler Lambda (hide output to avoid leaking secrets)
        run: SAVETOINK_BUCKET=${{ vars.SAVETOINK_BUCKET }} just deploy-lambda-scheduler > /dev/null
